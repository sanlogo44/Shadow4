[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-llm-engine"
version = "0.1.0"
description = "Shadow LLM Engine -- eigenständige KI-Engine, getrennt von der Shadow-Chat-Anwendung."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "torch>=2.2",
]

[project.optional-dependencies]
jax = ["jax>=0.4", "jaxlib>=0.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
shadow = "shadow_engine.cli:main"

[tool.setuptools.packages.find]
include = ["shadow_engine*"]
