# Beispiel-Konfiguration der Shadow LLM Engine.
# Kopieren nach engine.yaml und anpassen; per SHADOW_ENGINE_CONFIG referenzieren.

model_core:
  architecture: shadow-transformer
  hidden_size: 1024
  num_layers: 12
  num_heads: 16
  vocab_size: 32000
  max_sequence_length: 4096

tokenizer:
  vocab_size: 32000
  model_type: bpe
  languages: [de, en, auto]

training:
  batch_size: 8
  learning_rate: 0.0003
  max_steps: 100000
  checkpoint_every: 1000
  eval_every: 500
  checkpoint_dir: ./checkpoints
  precision: bf16

hardware:
  preferred_backend: auto
  preferred_device: auto
  allow_multi_gpu: true
  distributed: false

registry:
  root_dir: ./model_registry
  default_namespace: shadow-model

dataset:
  raw_dir: ./data/raw
  clean_dir: ./data/clean
  tokenized_dir: ./data/tokenized
  min_doc_length: 20
  dedupe_method: simhash
  quality_threshold: 0.5

node:
  role: standalone
  node_id: node-0
  master_port: 7331
  use_tls: true

api:
  host: 0.0.0.0
  port: 8420
  admin_token_env: SHADOW_ADMIN_TOKEN
