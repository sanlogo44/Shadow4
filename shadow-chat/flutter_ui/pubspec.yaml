name: shadow_chat
description: "Shadow Chat – modulare Chat-Oberfläche und Verwaltungsplattform. Kommuniziert mit dem Rust Core (shadow-core) über eine lokale HTTP-API. Modellunabhängig: die AI-Logik läuft in der separaten Shadow LLM Engine."
publish_to: "none"
version: 2.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_markdown: ^0.7.4
  flutter_colorpicker: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
