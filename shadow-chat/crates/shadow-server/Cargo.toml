[package]
name = "shadow-server"
version = "0.1.0"
edition = "2021"
description = "HTTP-API-Server: Brücke zwischen der Flutter-Oberflaeche und dem Rust Core (shadow-core)."

[lib]
name = "shadow_server"
path = "src/lib.rs"

[[bin]]
name = "shadow-server"
path = "src/main.rs"

[dependencies]
shadow-core = { path = "../shadow-core" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing-subscriber = { workspace = true }
