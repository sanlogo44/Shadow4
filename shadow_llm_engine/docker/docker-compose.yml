# Vorbereitung für lokale Mehr-Node-Simulation (Master + Training + Inference + Storage).
# Für echten Cluster-Betrieb werden diese Services auf getrennte physische
# Nodes verteilt; docker-compose dient hier v. a. der lokalen Entwicklung
# und dem Testen der Node-Kommunikation.

services:
  master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: ["python", "scripts/cluster_demo.py"]
    environment:
      - SHADOW_ENGINE_CONFIG=/app/config/engine.yaml
    volumes:
      - ../config:/app/config
    ports:
      - "7331:7331"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: ["python", "scripts/serve.py"]
    environment:
      - SHADOW_ENGINE_CONFIG=/app/config/engine.yaml
      - SHADOW_ADMIN_TOKEN=${SHADOW_ADMIN_TOKEN:-change-me}
    volumes:
      - ../config:/app/config
      - ../model_registry:/app/model_registry
      - ../data:/app/data
    ports:
      - "8420:8420"

  storage:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command: ["python", "-c", "print('Storage Node Platzhalter -- siehe shadow_engine.nodes.storage_node')"]
    volumes:
      - ../storage_data:/app/storage_data
